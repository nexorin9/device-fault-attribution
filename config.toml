# 医疗设备故障归因系统 —— 声明式配置骨架
#
# 原则：配置**只读**，程序永不回写本文件。策略与凭据分离 —— 凭据走环境变量
# （见 .env.example），本文件只放判定策略、词表与派单规则。
#
# 本文件当前为骨架（各段为空占位）。加载器与校验由实现任务补齐，
# 届时字段含义见本文件各段注释。

# 同源判定硬约束：型号 / 固件 / 到货批次 / 同源时间窗。
# 字段缺失即判「不可比」，不以默认值兜底参与同源判定。
[hard_constraints]

# 派单规则：优先级上下限、关键岗位下限、默认班组等。
[dispatch]

# 受控故障类别词表。键为稳定标识符，改名视为迁移事件并被配置校验检出。
[fault_vocabulary]

# 别名表：科室口语 / 厂商术语 → 受控故障类别标识符的回退映射。
[aliases]

# 班组能力覆盖：按班组声明其可处置项。
[team_capabilities]

# 确认预算：新簇与复现簇的确认复检次数、跨轮携带策略。
[confirm_budget]

# 三层叠加：默认类别映射 → 按科室覆盖 → 按班组覆盖。
[overrides]
