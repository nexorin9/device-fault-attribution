[package]
name = "dfa-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "医疗设备故障归因系统 · dfa-desktop 模块"

[dependencies]
serde.workspace = true
serde_json.workspace = true
dfa-core.workspace = true
dfa-store.workspace = true
egui = { workspace = true, optional = true }
eframe = { workspace = true, optional = true }
tray-icon = { workspace = true, optional = true }

[features]
default = []
# 有显示服务的工作站：cargo run -p dfa-desktop --features native --bin dfa-desktop
native = ["egui", "eframe", "tray-icon"]

[[bin]]
name = "dfa-desktop"
path = "src/main.rs"
required-features = ["native"]
